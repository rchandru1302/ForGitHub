<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alert Examples!!!</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h3>Alert examples in VS code</h3>
        <div class="alert alert-success" role="alert">
            <strong>Success!</strong> Represents a successful or positive action.
        </div>
        <div class="alert alert-info" role="alert">
            <strong>Info!</strong> Represents a neutral info change.
        </div>
        <div class="alert alert-warning" role="alert">
            <strong>Warning!</strong> Represents a Warning that needs attention.
        </div>
        <div class="alert alert-danger" role="alert">
            <strong>Danger!</strong> Represents a Danger negative action.
        </div>
    </div>
